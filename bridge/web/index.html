<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070f">
<title>DSH 深夜办公室</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="scene" width="1920" height="1080"></canvas>

    <div id="pet-layer">
      <canvas id="pet"></canvas>
    </div>

    <div id="cards"></div>

    <div id="pet-bubble" class="bubble is-hidden"><span id="pet-bubble-text"></span><i class="tail"></i></div>

    <div id="hud-top">
      <div class="plaque">
        <svg class="mark" viewBox="0 0 40 40" width="44" height="44" aria-hidden="true">
          <path d="M4 23.4c4.6 2.6 8.6 2.6 12.4 0 3.6-2.4 5.6-5.6 9.4-6.6.9 3.4 3.2 5.6 6.6 6.6-1.5 2.9-4.1 4.4-6.9 4.4-1.5 0-2.9-.4-4-1.2-.6 3.8-3.8 6.6-7.8 6.6H7.6C5.1 33.2 3 31.1 3 28.6c0-1.9.7-3.6 1-5.2z" fill="#f2b94b"/>
          <circle cx="10.4" cy="23.2" r="1.5" fill="#16244a"/>
          <path d="M14.2 10.6c1.6 2.6 4.2 4 7 4.4-2 1.4-4 2-6.2 2" stroke="#f2b94b" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".75"/>
        </svg>
        <div class="plaque-txt">
          <div class="plaque-title">DSH 深夜办公室<span class="dotted">·</span><span class="live-dot" id="live-dot"></span><span id="live-text">上线中</span></div>
          <div class="plaque-sub" id="plaque-sub">正在连接 Mac 上的办公室…</div>
        </div>
      </div>
      <div class="hud-right">
        <div class="chip"><span class="ico-moon"></span><span id="clock">--:--</span></div>
      </div>
    </div>

    <div id="hint" class="hint">
      <span class="key">Ok</span><span class="hint-t">戳戳鲸鱼娘</span>
      <span class="sep">·</span>
      <span class="key key-wide">长按 Ok</span><span class="hint-t">聊聊天</span>
      <span class="sep">·</span>
      <span class="key">◀▶▲▼</span><span class="hint-t">看看大家在忙什么</span>
    </div>

    <div id="panel" class="is-hidden">
      <div class="panel-card">
        <div class="panel-head">
          <div class="panel-title">和鲸鱼娘聊聊</div>
          <div class="panel-hint">↑↓ 选择　Ok 确定　Back 返回办公室</div>
        </div>
        <div class="panel-body">
          <div class="qlist" id="qlist"></div>
          <div class="reply">
            <div class="reply-q" id="reply-q">她正歪着头看你，等按钮亮起来…</div>
            <div class="reply-text" id="reply-text"></div>
          </div>
        </div>
        <div class="panel-foot">她说话的时候会看着你，还会把字幕一个一个字写出来。</div>
      </div>
    </div>

    <div id="toast" class="is-hidden"></div>

    <div id="waiting" class="is-hidden">
      <div class="wait-card">
        <svg class="wait-whale" viewBox="0 0 220 120" width="258" height="141" aria-hidden="true">
          <path d="M52 62 L18 34 L28 62 L18 90 Z" fill="#2c3a6e"/>
          <path d="M40 62 C 52 40 92 30 130 38 C 158 44 176 56 182 68 C 176 86 120 96 84 88 C 62 84 46 74 40 62 Z" fill="#2c3a6e"/>
          <path d="M70 80 C 96 92 140 92 168 78 C 138 86 96 86 70 80 Z" fill="#3a4a86" opacity=".75"/>
          <path d="M96 80 C 88 92 76 98 64 98 C 76 88 84 82 96 80 Z" fill="#2c3a6e"/>
          <circle cx="152" cy="58" r="3.8" fill="#05070f"/>
          <circle cx="153" cy="57" r="1.3" fill="#e9f2ff"/>
          <path d="M120 30 C 122 18 130 10 142 8" stroke="#f2b94b" stroke-width="3" fill="none" stroke-linecap="round" opacity=".75"/>
          <circle cx="150" cy="6" r="2" fill="#f7ecd2" opacity=".6"/>
          <circle cx="190" cy="30" r="1.6" fill="#f7ecd2" opacity=".45"/>
          <circle cx="24" cy="14" r="1.6" fill="#f7ecd2" opacity=".4"/>
          <circle cx="104" cy="104" r="1.4" fill="#3fd0c9" opacity=".5"/>
          <circle cx="76" cy="106" r="1.1" fill="#3fd0c9" opacity=".4"/>
        </svg>
        <div class="wait-title">等 Mac 上的办公室上线…</div>
        <div class="wait-sub"><span id="wait-dots">·</span> 每 2 秒自动重连，连上就自己开门</div>
      </div>
    </div>

    <div id="boot">正在点亮办公室<span class="boot-dots"></span></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
