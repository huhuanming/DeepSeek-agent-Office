<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b14">
<title>DSH 深夜办公室</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="scene" width="1920" height="1080"></canvas>

    <div id="pet-layer">
      <canvas id="pet"></canvas>
    </div>

    <div id="cards"></div>

    <div id="pet-bubble" class="bubble is-hidden"><span id="pet-bubble-text"></span><i class="tail"></i></div>

    <div id="hud-top">
      <div class="plaque">
        <svg class="mark" viewBox="0 0 16 16" width="44" height="44" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="1" y="1" width="14" height="14" fill="#152241"/>
          <rect x="0" y="2" width="1" height="12" fill="#d9a441"/>
          <rect x="15" y="2" width="1" height="12" fill="#d9a441"/>
          <rect x="2" y="0" width="12" height="1" fill="#d9a441"/>
          <rect x="2" y="15" width="12" height="1" fill="#d9a441"/>
          <!-- Maid headband + water spout -->
          <rect x="4" y="4" width="6" height="1" fill="#faf8f2"/>
          <rect x="7" y="2" width="1" height="2" fill="#6fd0e0"/>
          <rect x="5" y="2" width="1" height="1" fill="#a8eef5"/>
          <rect x="9" y="2" width="1" height="1" fill="#a8eef5"/>
          <!-- Chubby pixel whale body -->
          <rect x="3" y="5" width="8" height="2" fill="#6fd0e0"/>
          <rect x="2" y="7" width="10" height="3" fill="#4aa3b8"/>
          <rect x="12" y="6" width="2" height="2" fill="#6fd0e0"/>
          <rect x="13" y="5" width="1" height="1" fill="#6fd0e0"/>
          <rect x="13" y="8" width="1" height="1" fill="#6fd0e0"/>
          <!-- White belly & eye & blush -->
          <rect x="3" y="10" width="7" height="2" fill="#faf8f2"/>
          <rect x="4" y="7" width="2" height="2" fill="#070b14"/>
          <rect x="4" y="7" width="1" height="1" fill="#faf8f2"/>
          <rect x="3" y="9" width="1" height="1" fill="#e85d5d"/>
          <!-- Waves -->
          <rect x="2" y="13" width="3" height="1" fill="#284178"/>
          <rect x="6" y="13" width="4" height="1" fill="#284178"/>
          <rect x="11" y="13" width="3" height="1" fill="#284178"/>
        </svg>
        <div class="plaque-txt">
          <div class="plaque-title"><span id="office-title">DSH 像素办公室</span><span class="dotted">·</span><span class="live-dot" id="live-dot"></span><span id="live-text">上线中</span></div>
          <div class="plaque-sub" id="plaque-sub">正在连接 Mac 上的办公室…</div>
        </div>
      </div>
      <div class="hud-right">
        <div class="chip">
          <span class="ico-moon" id="ico-sky"></span>
          <span id="sky-label" class="sky-label"></span>
          <span id="clock">--:--</span>
        </div>
      </div>
    </div>

    <div id="hint" class="hint">
      <span class="key">Ok</span><span class="hint-t">戳戳鲸鱼娘</span>
      <span class="sep">▪</span>
      <span class="key key-wide">长按 Ok</span><span class="hint-t">聊聊天</span>
      <span class="sep">▪</span>
      <span class="key">◀▶▲▼</span><span class="hint-t">看看大家在忙什么</span>
    </div>

    <div id="panel" class="is-hidden">
      <div class="panel-card">
        <div class="panel-head">
          <div class="panel-title">和鲸鱼娘聊聊</div>
          <div class="panel-hint">↑↓ 选择　Ok 确定　Back 返回办公室</div>
        </div>
        <div class="panel-body">
          <div class="qlist" id="qlist"></div>
          <div class="reply">
            <div class="reply-q" id="reply-q">她正歪着头看你，等按钮亮起来…</div>
            <div class="reply-text" id="reply-text"></div>
          </div>
        </div>
        <div class="panel-foot">她说话的时候会看着你，还会把字幕一个一个字写出来。</div>
      </div>
    </div>

    <div id="toast" class="is-hidden"></div>

    <div id="waiting" class="is-hidden">
      <div class="wait-card">
        <svg class="wait-whale" viewBox="0 0 32 18" width="256" height="144" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="10" y="4" width="9" height="1" fill="#faf8f2"/>
          <rect x="9" y="5" width="12" height="2" fill="#6fd0e0"/>
          <rect x="7" y="7" width="16" height="4" fill="#4aa3b8"/>
          <rect x="8" y="11" width="14" height="2" fill="#284178"/>
          <rect x="10" y="11" width="10" height="2" fill="#faf8f2"/>
          <rect x="4" y="6" width="3" height="3" fill="#4aa3b8"/>
          <rect x="2" y="4" width="2" height="2" fill="#6fd0e0"/>
          <rect x="2" y="9" width="2" height="2" fill="#6fd0e0"/>
          <rect x="19" y="8" width="2" height="2" fill="#070b14"/>
          <rect x="20" y="8" width="1" height="1" fill="#faf8f2"/>
          <rect x="18" y="10" width="1" height="1" fill="#e85d5d"/>
          <rect x="15" y="1" width="1" height="2" fill="#6fd0e0"/>
          <rect x="13" y="1" width="1" height="1" fill="#f2b94b"/>
          <rect x="17" y="1" width="1" height="1" fill="#f2b94b"/>
          <rect x="6" y="15" width="6" height="1" fill="#1e3160"/>
          <rect x="14" y="15" width="8" height="1" fill="#1e3160"/>
        </svg>
        <div class="wait-title">等 Mac 上的办公室上线…</div>
        <div class="wait-sub"><span id="wait-dots">·</span> 每 2 秒自动重连，连上就自己开门</div>
      </div>
    </div>

    <div id="boot">正在点亮像素办公室<span class="boot-dots"></span></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
