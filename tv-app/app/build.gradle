plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.dsh.office.tv'
    compileSdk 35

    // The DSH sandbox does not allow writing $HOME/.android, so use a project-local
    // debug keystore instead of the auto-generated one (~/.android/debug.keystore).
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'dev.dsh.office.tv'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No third-party runtime dependencies on purpose: the APK is a thin WebView shell
// and must build offline / without androidx.
